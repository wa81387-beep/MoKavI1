<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | MoKavi</title>
  <link rel="stylesheet" href="style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div id="cart-items"></div>

  <div class="cart-summary">
    <h3>Total: <span id="total-price">0</span> LE</h3>
    <button onclick="goToCheckout()"> Checkout </button>
  </div>

  <script>

<img src="${item.image}" width="80">

<h3>${item.name}</h3>

<p>${item.price} LE</p>

<p>Size: ${item.size}</p>

<div class="qty-box">
...
</div>
  <div class="cart-item">

  <img src="${item.image}">

  <div class="info">
    <h3>${item.name}</h3>
    <p>${item.price} LE</p>
    <p>Size: ${item.size}</p>
  </div>

  <div class="qty-box">
    <button onclick="changeQty(${index},-1)">-</button>
    <span>${item.qty}</span>
    <button onclick="changeQty(${index},1)">+</button>
  </div>

</div>
  cartItems.innerHTML += `
<div class="cart-item">

  <img src="${item.image}">

  <div class="info">
    <h3>${item.name}</h3>
    <p>${item.price} LE</p>
    <p>Size: ${item.size}</p>
  </div>

  <div class="qty-box">
    <button onclick="changeQty(${index},-1)">-</button>
    <span>${item.qty}</span>
    <button onclick="changeQty(${index},1)">+</button>
  </div>

  <button onclick="removeItem(${index})">X</button>

</div>
`;
</body>
</html>
